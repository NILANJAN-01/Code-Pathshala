[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-pathshala"                       # <-- PyPI name
version = "0.1.0"                              # bump with each release
description = "Beginner-friendly Python package with reusable utilities, exercises, tests, and mini-project templates."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nilanjan Singhamahapatra" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

# Optional but recommended
keywords = ["education", "teaching", "python", "learning", "cli", "beginner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pathshala = "code_pathshala.cli:app"          # console command

[project.urls]
Homepage = "https://github.com/NILANJAN-01/Code-Pathshala"
Issues   = "https://github.com/NILANJAN-01/Code-Pathshala/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["code_pathshala*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "mypy>=1.0",
  "ruff>=0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

